<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blooket Trivia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- MAIN APP CONTAINER -->
  <div class="app-container">
    
    <!-- HEADER AREA -->
    <header class="header">
      <h1 id="app-title">Blooket Trivia</h1>
      <p id="game-status">Get ready to answer questions!</p>
    </header>

    <!-- FEATURE 2: AVATAR SELECTION AREA -->
    <section class="avatar-section">
      <h3>Choose Your Blook Avatar:</h3>
      <div class="avatar-grid">
        <button class="avatar-btn" data-avatar="Dog">🐶 Dog</button>
        <button class="avatar-btn" data-avatar="Cat">🐱 Cat</button>
        <button class="avatar-btn" data-avatar="Dragon">🐉 Dragon</button>
        <button class="avatar-btn" data-avatar="Astronaut">👨‍🚀 Astronaut</button>
      </div>
      <p id="selected-avatar-text">Selected Blook: <span id="current-blook">None</span></p>
    </section>
  
    <!-- FEATURE 3: TRIVIA QUESTION & ANSWERS AREA -->
    <section class="question-section">
      <h2 id="question-text">What is the capital of France?</h2>
      <div class="answers-grid">
        <button class="answer-btn">Paris</button>
        <button class="answer-btn">London</button>
        <button class="answer-btn">Berlin</button>
        <button class="answer-btn">Madrid</button>
      </div>
    
      <!-- FEATURE 6: NEXT QUESTION BUTTON -->
      <button id="next-btn" class="hidden">Next Question ➔</button>
    </section>
 
    <!-- FEATURE 6: FINAL PODIUM END SCREEN -->
    <section id="end-screen" class="hidden">
      <h2>Game Over! 🏆</h2>
      <p id="final-stats">You finished in 1st Place!</p>
      <div class="podium-container">
        <div class="podium-step second">
          <span class="podium-rank">2nd</span>
          <span class="podium-name">Cat</span>
        </div>
        <div class="podium-step first">
          <span class="podium-rank">1st</span>
          <span id="podium-winner-name" class="podium-name">You</span>
        </div>
        <div class="podium-step third">
          <span class="podium-rank">3rd</span>
          <span class="podium-name">Dog</span>
        </div>
      </div>
      <button id="restart-btn">Play Again</button>
    </section>
    
    <!-- FEATURE 4: SCORE & PLACEMENT BANNER -->
    <section class="banner-section">
      <div class="stat-box">
        <span class="stat-label">Score:</span>
        <span id="score-display">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Placement:</span>
        <span id="placement-display">#4</span>
      </div>
    </section>
  
  </div>


  <script src="script.js"></script>
</body>
</html>
